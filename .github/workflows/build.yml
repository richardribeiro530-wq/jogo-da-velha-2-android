name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'JogoDaVelha2Android.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceitar licencas e configurar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto Android
        run: unzip JogoDaVelha2Android.zip -d projeto

      - name: Compilar APK
        working-directory: projeto/JogoDaVelha2Android
        run: gradle assembleDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: JogoDaVelha2-APK
          path: projeto/JogoDaVelha2Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
